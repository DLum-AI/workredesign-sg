<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skills Library | SkillsMap.sg</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="site-header"></div>

<section class="hero">
  <div class="container">
    <span class="pill-badge">Skills library</span>
    <h1>Browse the national skills taxonomy</h1>
    <p class="lead">2,182 unique skills behind the Skills Framework. Useful for redeployment: find out where else in the economy a skill your team already has is in demand.</p>
  </div>
</section>

<main>
  <div class="container">
    <div class="card">
      <div class="grid-3">
        <div class="field" style="grid-column: span 2;">
          <label>Search skills</label>
          <input type="text" id="skillSearch" placeholder="e.g. data analytics, stakeholder management, welding…" autocomplete="off" />
        </div>
        <div class="field">
          <label>Type</label>
          <select id="typeFilter">
            <option value="">TSC + CCS</option>
            <option value="tsc">Technical (TSC)</option>
            <option value="ccs">Critical Core (CCS)</option>
          </select>
        </div>
      </div>
      <label style="font-size:0.85rem;"><input type="checkbox" id="emergingOnly" /> Emerging skills only</label>
      <p class="muted mt-24" id="resultCount" style="margin-bottom:0;"></p>
    </div>

    <div id="skillList"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/layout.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/skills-library.js"></script>
</body>
</html>
